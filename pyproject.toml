[project]
name = "loopstation"
version = "0.01"
authors = [
	{ name= "Chris Rui Zhao", email= "chriszhao6868@gmail.com" },
]
description = "CLI recorder for lazy tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"rich",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lpst"]

[project.scripts]
lpst = "lpst.bin.lpst:main"
